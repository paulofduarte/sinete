name: ci

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]

jobs:
  # Lint + format gate. build depends on this, so nothing proceeds when treefmt
  # formatting, golangci-lint (which includes govet) or shellcheck fail.
  lint:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest] # arm64-darwin, x86_64-linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v22
      - name: lint + format
        run: nix flake check --accept-flake-config
      - name: golangci-lint
        run: nix develop --accept-flake-config -c bash -c 'cd src && golangci-lint run ./...'
      - name: swiftlint
        if: runner.os == 'macOS'
        run: nix develop --accept-flake-config -c bash -c 'cd src && swiftlint lint --strict'

  build:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest] # arm64-darwin, x86_64-linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v22
      - name: build
        run: nix build --accept-flake-config
      - name: test
        run: nix develop --accept-flake-config -c go -C src test ./...
      # The Linux TPM epoch backend's NV-counter algorithm (epoch_tpm.go) is verified
      # against the in-process go-tpm simulator. It's behind the `tpmsim` build tag so
      # the normal build stays cgo-light; the devshell provides the OpenSSL the
      # simulator's cgo needs. Runs on both OSes — the algorithm is platform-neutral.
      - name: tpmsim test (NV counter vs go-tpm simulator)
        run: nix develop --accept-flake-config -c go -C src test -tags tpmsim ./internal/cryptoprocessor

  # The full Linux TPM + local-session end-to-end coverage lives in the heavier 2-VM
  # distro matrix (.github/workflows/e2e-matrix.yml — Debian + Alpine under QEMU/swtpm),
  # which runs on demand and on releases rather than per-push. Per-push, the crypto path
  # is covered by the tpmsim test above.
