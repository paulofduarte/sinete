name: ci

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]

jobs:
  # Lint + format gate. build depends on this, so nothing proceeds when treefmt
  # formatting, golangci-lint (which includes govet) or shellcheck fail.
  lint:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest] # arm64-darwin, x86_64-linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v22
      - name: lint + format
        run: nix flake check --accept-flake-config
      - name: golangci-lint
        run: nix develop --accept-flake-config -c golangci-lint run ./...
      - name: swiftlint
        if: runner.os == 'macOS'
        run: nix develop --accept-flake-config -c swiftlint lint --strict

  build:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest] # arm64-darwin, x86_64-linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v22
      - name: build
        run: nix build --accept-flake-config
      - name: test
        run: nix develop --accept-flake-config -c go test ./...
      # The Linux TPM epoch backend's NV-counter algorithm (epoch_tpm.go) is verified
      # against the in-process go-tpm simulator. It's behind the `tpmsim` build tag so
      # the normal build stays cgo-light; the devshell provides the OpenSSL the
      # simulator's cgo needs. Runs on both OSes — the algorithm is platform-neutral.
      - name: tpmsim test (NV counter vs go-tpm simulator)
        run: nix develop --accept-flake-config -c go test -tags tpmsim ./internal/enclave

  # Boot a real Linux kernel with a software TPM (swtpm) and run the Linux enclave
  # backend end-to-end against /dev/tpmrm0 — the kernel resource-manager path the
  # simulator can't exercise (it's where the HMAC-session hang lived). x86_64 only;
  # KVM makes it fast on the runner.
  integration:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v22
      # /dev/kvm exists on ubuntu-latest but isn't group-accessible by default; make it
      # world-usable so the test runs with KVM. Best-effort — run.sh falls back to TCG
      # (slower, but fine within the timeout) if /dev/kvm is absent or unusable.
      - name: enable KVM (best-effort)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: qemu + swtpm integration test
        run: nix develop --accept-flake-config -c bash test/qemu/run.sh
