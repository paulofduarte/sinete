name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # Same lint + format gate as ci. release depends on it, so a tagged release
  # never builds or publishes an artifact when lint/format fails.
  lint:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest] # arm64-darwin, x86_64-linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v22
      - name: lint + format
        run: nix flake check --accept-flake-config
      - name: golangci-lint
        run: nix develop --accept-flake-config -c golangci-lint run ./...
      - name: swiftlint
        if: runner.os == 'macOS'
        run: nix develop --accept-flake-config -c swiftlint lint --strict

  release:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest] # arm64-darwin, x86_64-linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v22
      - name: build
        run: nix build --accept-flake-config
      - name: stage artifact
        run: |
          mkdir -p dist
          cp result/bin/sinete "dist/sinete-${{ runner.os }}-${{ runner.arch }}"
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: true
          generate_release_notes: true
