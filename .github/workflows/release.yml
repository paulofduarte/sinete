name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # Same lint + format gate as ci. release depends on it, so a tagged release
  # never builds or publishes an artifact when lint/format fails.
  lint:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest] # arm64-darwin, x86_64-linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v22
      - name: lint + format
        run: nix flake check --accept-flake-config
      - name: golangci-lint
        run: nix develop --accept-flake-config -c golangci-lint run ./...
      - name: swiftlint
        if: runner.os == 'macOS'
        run: nix develop --accept-flake-config -c swiftlint lint --strict

  release:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest] # arm64-darwin, x86_64-linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v22
      - name: build
        run: nix build --accept-flake-config
      - name: stage artifact
        run: |
          mkdir -p dist
          cp result/bin/sinete "dist/sinete-${{ runner.os }}-${{ runner.arch }}"
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: true
          generate_release_notes: true

  # The heavier 2-VM distro matrix (Debian glibc / systemd-logind + Alpine musl /
  # elogind): boots real cloud images under QEMU + swtpm and runs the full local-session
  # + TPM matrix on each. Too slow/networked for the per-push CI gate, so it runs here on
  # tagged releases. It does NOT gate `release` (a flaky image download must not block a
  # publish) — it is a release-time signal you can inspect.
  e2e-matrix:
    needs: lint
    # This job only reads the repo + boots external VM images; drop the workflow-level
    # `contents: write` to read-only.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v22
      - name: enable KVM (best-effort)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: distro e2e matrix (Debian + Alpine)
        run: nix run --accept-flake-config .#e2e-linux-full
