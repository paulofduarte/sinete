version = 1

# Files that cannot carry an SPDX header inline are declared here so the tree is
# fully REUSE-compliant (every file has copyright + license information).

[[annotations]]
path = ["CLAUDE.md", "LICENSE.md", "logo.webp"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Paulo Duarte"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = "devenv.lock"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Paulo Duarte"
SPDX-License-Identifier = "Apache-2.0"

# The entitlements plist carries no inline SPDX header so codesign parses it cleanly; the manual
# checklist is plain Markdown.
[[annotations]]
path = ["sinete.entitlements", "manual/z3-macos-se.md"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Paulo Duarte"
SPDX-License-Identifier = "Apache-2.0"
