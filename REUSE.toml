# fully REUSE-compliant (every file has copyright + license information).

[[annotations]]
path = ["CLAUDE.md", "LICENSE.md", "logo.webp"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Paulo Duarte"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
